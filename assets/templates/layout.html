{{define "layout_start"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{.Title}} - Go Girard</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        />
        <style>
            body {
                min-height: 100vh;
            }

            .app-shell {
                display: grid;
                grid-template-columns: 6rem minmax(0, 1fr);
                gap: var(--pico-spacing);
                align-items: start;
                padding-block: var(--pico-spacing);
            }

            .app-menu {
                position: sticky;
                top: var(--pico-spacing);
            }

            .page-header {
                display: flex;
                align-items: start;
                justify-content: space-between;
                gap: var(--pico-spacing);
                flex-wrap: wrap;
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                align-items: center;
            }

            .actions > form > button {
                width: auto;
                margin: 0;
            }

            .actions > * {
                margin: 0;
            }

            .actions > button[type="submit"] {
                width: auto;
            }

            .company-picker {
                position: relative;
                margin-bottom: var(--pico-spacing);
            }

            .company-picker > fieldset {
                margin-bottom: 0;
            }

            .company-options {
                position: absolute;
                z-index: 10;
                top: 100%;
                right: 0;
                left: 0;
                max-height: 16rem;
                overflow-y: auto;
                margin: 0.25rem 0 0;
                padding: 0.25rem;
                list-style: none;
                background: var(--pico-form-element-background-color);
                border: var(--pico-border-width) solid
                    var(--pico-form-element-border-color);
                border-radius: var(--pico-border-radius);
                box-shadow: 0 0.25rem 0.75rem rgb(0 0 0 / 15%);
            }

            .company-options[hidden] {
                display: none;
            }

            .company-options > li {
                margin: 0;
                padding: 0.5rem 0.75rem;
                border-radius: var(--pico-border-radius);
                cursor: pointer;
            }

            .company-options > li:hover,
            .company-options > li.active {
                background: var(--pico-primary-focus);
            }

            .company-options > li.empty {
                color: var(--pico-muted-color);
                cursor: default;
            }

            button.danger.outline {
                --pico-color: var(--pico-del-color);
                --pico-border-color: var(--pico-del-color);
            }

            button.danger.outline:is(:hover, :active, :focus) {
                --pico-color: var(--pico-primary-inverse);
                --pico-background-color: var(--pico-del-color);
                --pico-border-color: var(--pico-del-color);
            }


            .pagination {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.5rem;
            }

            .pagination > * {
                width: auto;
                margin: 0;
                white-space: nowrap;
            }

            @media (max-width: 768px) {
                .app-shell {
                    grid-template-columns: 1fr;
                }

                .app-menu {
                    position: static;
                    order: -1;
                }
            }
        </style>
    </head>
    <body>
        <div class="container-fluid app-shell">
            <aside class="app-menu">
                <strong>Go Girard</strong>
                <nav>
                    <ul>
                        <li>
                            <a
                                href="/persons"
                                {{if eq .ActiveMenu "persons"}}aria-current="page"{{end}}
                            >
                                Persons
                            </a>
                        </li>
                        <li>
                            <a
                                href="/companies"
                                {{if eq .ActiveMenu "companies"}}aria-current="page"{{end}}
                            >
                                Companies
                            </a>
                        </li>
                    </ul>
                </nav>
            </aside>

            <main>{{end}} {{define "layout_end"}}</main>
        </div>
    </body>
</html>
{{end}}
